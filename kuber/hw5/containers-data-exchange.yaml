apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange
  template:
    metadata:
      labels:
        app: data-exchange
    spec:
      containers:
        - name: writer
          image: busybox
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date)" >> /shared/data.txt
                sleep 5
              done
          volumeMounts:
            - name: shared-storage
              mountPath: /shared
        - name: reader
          image: busybox  # используем busybox вместо multitool для простоты
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                if [ -f /shared/data.txt ]; then
                  tail -n 1 /shared/data.txt
                fi
                sleep 2
              done
          volumeMounts:
            - name: shared-storage
              mountPath: /shared
      volumes:
        - name: shared-storage
          emptyDir: {}