data_dir: /var/lib/vector
sources:
  docker_logs:
    type: docker_logs
    include_labels:
      - com.docker.compose.project=hw2
transforms:
  parse_logs:
    type: remap
    inputs:
      - docker_logs
    source: |
      .service = .container_name
sinks:
  elasticsearch:
    type: elasticsearch
    inputs:
      - parse_logs
    endpoint: http://elasticsearch:9200
    index: logs-%Y.%m.%d
    healthcheck: true