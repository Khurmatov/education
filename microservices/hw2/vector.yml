data_dir: /var/lib/vector
sources:
  docker_logs:
    type: docker_logs
    include_labels:
      - com.docker.compose.project=hw2
sinks:
  elasticsearch:
    type: elasticsearch
    inputs:
      - docker_logs
    endpoint: http://elasticsearch:9200
    mode: bulk
    index: logs-%Y.%m.%d
    healthcheck: true