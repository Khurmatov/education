data_dir: /var/lib/vector
sources:
  docker_logs:
    type: docker_logs
    include_labels:
      - "com.docker.compose.project=hw2"
sinks:
  elasticsearch:
    type: elasticsearch
    inputs:
      - docker_logs
    host: http://elasticsearch:9200
    index: logs-%Y.%m.%d
    doc_type: "_doc"
    healthcheck: true