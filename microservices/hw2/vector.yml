data_dir: /var/lib/vector

sources:
  docker_logs:
    type: docker_logs
    include_containers:
      - hw2-storage-1
      - hw2-uploader-1
      - hw2-security-1
      - hw2-gateway-1
      - hw2-createbuckets-1

sinks:
  elasticsearch:
    type: elasticsearch
    inputs:
      - docker_logs
    endpoint: http://elasticsearch:9200
    mode: bulk
    bulk:
      index: logs-%Y.%m.%d
    healthcheck: true
    auth:
      strategy: basic
      user: elastic
      password: qwerty123456