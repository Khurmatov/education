volumes:
  data:
  prometheus-data:
  grafana_data:

networks:
  microservices_net:
    driver: bridge

services:
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${Storage_AccessKey:-minioadmin}
      MINIO_ROOT_PASSWORD: ${Storage_Secret:-minioadmin123}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - microservices_net

  createbuckets:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for storage to be ready...' &&
      sleep 10 &&
      echo 'Configuring alias...' &&
      /usr/bin/mc alias set myminio http://storage:9000 ${Storage_AccessKey:-minioadmin} ${Storage_Secret:-minioadmin123} &&
      echo 'Creating bucket...' &&
      /usr/bin/mc mb --ignore-existing myminio/${Storage_Bucket:-images} &&
      echo 'Setting bucket policy...' &&
      /usr/bin/mc anonymous set download myminio/${Storage_Bucket:-images} &&
      echo 'Bucket setup complete!' &&
      exit 0;
      "
    networks:
      - microservices_net

  uploader:
    build: ./uploader
    depends_on:
      storage:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    expose:
      - 3000
    environment:
      PORT: 3000
      S3_HOST: storage
      S3_PORT: 9000
      S3_ACCESS_KEY: ${Storage_AccessKey:-minioadmin}
      S3_ACCESS_SECRET: ${Storage_Secret:-minioadmin123}
      S3_BUCKET: ${Storage_Bucket:-images}
    networks:
      - microservices_net

  security:
    build: ./security
    expose:
      - 3000
    environment:
      PORT: 3000
    networks:
      - microservices_net

  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - security
      - uploader
      - storage
    networks:
      - microservices_net