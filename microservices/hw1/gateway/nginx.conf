events {
    worker_connections 1024;
}

http {
    upstream security_service {
        server security:3000;
    }

    upstream uploader_service {
        server uploader:3000;
    }

    upstream minio_service {
        server storage:9000;
    }

    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    server {
        listen 80;
        server_name localhost;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 100M;

        # ============ АНОНИМНЫЕ ЭНДПОИНТЫ ============

        # Регистрация - анонимный доступ
        location = /register {
            limit_req zone=api_limit burst=20 nodelay;

            if ($request_method != POST) {
                return 405;
            }

            proxy_pass http://security_service/v1/user;
            proxy_set_header Content-Type $content_type;
        }

        # Получение токена - анонимный доступ (POST /token)
        location = /token {
            limit_req zone=login_limit burst=3 nodelay;

            if ($request_method != POST) {
                return 405;
            }

            proxy_pass http://security_service/v1/token;
            proxy_set_header Content-Type $content_type;
        }

        # ============ ЗАЩИЩЕННЫЕ ЭНДПОИНТЫ ============

        # Внутренний эндпоинт для проверки токена
        location = /_validate_token {
            internal;
            proxy_pass http://security_service/v1/token/validation;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        # Получение информации о пользователе (GET /user)
        location = /user {
            auth_request /_validate_token;
            proxy_pass http://security_service/v1/user;
            proxy_set_header Authorization $http_authorization;
        }

        # Загрузка файла (POST /upload)
        location = /upload {
            auth_request /_validate_token;
            client_max_body_size 50M;
            proxy_pass http://uploader_service/v1/upload;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type $content_type;

            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Получение изображения (GET /images/{image})
        location ~ ^/images/(?<image_name>[^/]+\.jpg)$ {
            auth_request /_validate_token;
            proxy_set_header Authorization $http_authorization;

            proxy_pass http://minio_service/images/$image_name;
            proxy_set_header Host storage:9000;
            proxy_buffering off;
        }

        # ============ ОБРАБОТКА ОШИБОК ============

        error_page 401 = @error401;
        location @error401 {
            add_header Content-Type application/json;
            return 401 '{"error": "Unauthorized", "message": "Требуется валидный токен"}';
        }

        error_page 404 = @error404;
        location @error404 {
            add_header Content-Type application/json;
            return 404 '{"error": "Not Found", "message": "Ресурс не найден"}';
        }

        error_page 405 = @error405;
        location @error405 {
            add_header Content-Type application/json;
            return 405 '{"error": "Method Not Allowed", "message": "Метод не поддерживается"}';
        }
    }
}