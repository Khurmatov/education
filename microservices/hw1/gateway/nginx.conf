events {
    worker_connections 1024;
}

http {
    # Upstream определения для сервисов
    upstream security_service {
        server security:3000;
    }

    upstream uploader_service {
        server uploader:3000;
    }

    upstream minio_service {
        server storage:9000;
    }

    # Лимиты для защиты от брутфорса и DDoS
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # Кеширование для оптимизации
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=images_cache:10m max_size=1g inactive=60m;

    server {
        listen 80;
        server_name localhost;

        # Базовые заголовки для проксирования
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Максимальный размер загружаемых файлов
        client_max_body_size 100M;

        # ============ АНОНИМНЫЕ ЭНДПОИНТЫ ============

        # Регистрация нового пользователя - анонимный доступ
        location = /v1/register {
            limit_req zone=api_limit burst=20 nodelay;
            
            # Проверяем метод
            if ($request_method != POST) {
                return 405;
            }
            
            # Проксируем в security сервис (POST /v1/user)
            proxy_pass http://security_service/v1/user;
            proxy_set_header Content-Type $content_type;
        }

        # Получение токена (логин) - анонимный доступ
        location = /v1/token {
            limit_req zone=login_limit burst=3 nodelay;
            
            if ($request_method != POST) {
                return 405;
            }
            
            proxy_pass http://security_service/v1/token;
            proxy_set_header Content-Type $content_type;
        }

        # ============ ЗАЩИЩЕННЫЕ ЭНДПОИНТЫ (ТРЕБУЮТ ТОКЕН) ============

        # Внутренний эндпоинт для проверки токена
        location = /_validate_token {
            internal;
            
            # Проксируем запрос в security сервис для валидации
            proxy_pass http://security_service/v1/token/validation;
            
            # Передаем заголовок Authorization как есть
            proxy_set_header Authorization $http_authorization;
            
            # Не передаем тело запроса
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            
            # Если сервис вернул 200 - токен валидный, если 401/403 - невалидный
            proxy_intercept_errors on;
        }

        # Получение информации о пользователе - требует токен
        location = /v1/user {
            # Проверка токена
            auth_request /_validate_token;
            
            # Если токен валидный, проксируем запрос
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-ID $user_id;
            
            # Передаем токен дальше (может пригодиться)
            proxy_set_header Authorization $http_authorization;
            
            # Проксируем в security сервис (GET /v1/user)
            proxy_pass http://security_service/v1/user;
        }

        # Загрузка файла - требует токен
        location = /v1/upload {
            # Проверка токена
            auth_request /_validate_token;
            
            # Ограничение размера загружаемого файла
            client_max_body_size 50M;
            
            # Передаем токен
            proxy_set_header Authorization $http_authorization;
            
            # Проксируем в uploader сервис (POST /v1/upload)
            proxy_pass http://uploader_service/v1/upload;
            proxy_set_header Content-Type $content_type;
            
            # Таймауты для загрузки больших файлов
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Получение изображения по имени - требует токен
        location ~ ^/v1/user/(?<image_name>[^/]+\.jpg)$ {
            # Проверка токена
            auth_request /_validate_token;
            
            # Передаем токен (хотя Minio может его не использовать)
            proxy_set_header Authorization $http_authorization;
            
            # Настройки кеширования для изображений
            proxy_cache images_cache;
            proxy_cache_valid 200 60m;
            proxy_cache_key "$uri";
            add_header X-Cache-Status $upstream_cache_status;
            
            # Проксируем в Minio с правильным путем
            rewrite ^/v1/user/(.*)$ /images/$1 break;
            proxy_pass http://minio_service;
            
            # Minio ожидает определенные заголовки
            proxy_set_header Host storage:9000;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Отключаем буферизацию для потоковой передачи файлов
            proxy_buffering off;
            proxy_cache off;  # Отключаем кеширование для потоковой передачи
        }

        # ============ ОБРАБОТКА ОШИБОК ============

        # Ошибка аутентификации (401)
        error_page 401 = @error_401;
        location @error_401 {
            add_header Content-Type application/json;
            return 401 '{
                "error": "Unauthorized",
                "message": "Требуется валидный токен в заголовке Authorization",
                "status": 401
            }';
        }

        # Ошибка доступа (403)
        error_page 403 = @error_403;
        location @error_403 {
            add_header Content-Type application/json;
            return 403 '{
                "error": "Forbidden",
                "message": "Недостаточно прав для доступа к ресурсу",
                "status": 403
            }';
        }

        # Ресурс не найден (404)
        error_page 404 = @error_404;
        location @error_404 {
            add_header Content-Type application/json;
            return 404 '{
                "error": "Not Found",
                "message": "Запрашиваемый ресурс не найден",
                "status": 404
            }';
        }

        # Метод не поддерживается (405)
        error_page 405 = @error_405;
        location @error_405 {
            add_header Content-Type application/json;
            return 405 '{
                "error": "Method Not Allowed",
                "message": "HTTP метод не поддерживается для данного эндпоинта",
                "status": 405
            }';
        }

        # Внутренняя ошибка сервера (500)
        error_page 500 502 503 504 = @error_500;
        location @error_500 {
            add_header Content-Type application/json;
            return 500 '{
                "error": "Internal Server Error",
                "message": "Внутренняя ошибка сервера",
                "status": 500
            }';
        }
    }
}