events {
    worker_connections 1024;
}

http {
    # Кеширование для оптимизации - ОДИН РАЗ!
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=images_cache:10m max_size=1g inactive=60m;

    upstream security_service {
        server security:3000;
    }

    upstream uploader_service {
        server uploader:3000;
    }

    upstream minio_service {
        server storage:9000;
    }

    # Лимиты для защиты от брутфорса и DDoS
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    server {
        listen 80;
        server_name localhost;

        # Базовые заголовки для проксирования
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Максимальный размер загружаемых файлов
        client_max_body_size 100M;

        # ============ АНОНИМНЫЕ ЭНДПОИНТЫ ============

        # Регистрация нового пользователя - анонимный доступ
        location = /v1/register {
            limit_req zone=api_limit burst=20 nodelay;

            if ($request_method != POST) {
                return 405;
            }

            proxy_pass http://security_service/v1/user;
            proxy_set_header Content-Type $content_type;
        }

        # Получение токена (логин) - анонимный доступ
        location = /v1/token {
            limit_req zone=login_limit burst=3 nodelay;

            if ($request_method != POST) {
                return 405;
            }

            proxy_pass http://security_service/v1/token;
            proxy_set_header Content-Type $content_type;
        }

        # ============ ЗАЩИЩЕННЫЕ ЭНДПОИНТЫ (ТРЕБУЮТ ТОКЕН) ============

        # Внутренний эндпоинт для проверки токена
        location = /_validate_token {
            internal;

            proxy_pass http://security_service/v1/token/validation;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        # Получение информации о пользователе - требует токен
        location = /v1/user {
            auth_request /_validate_token;
            proxy_pass http://security_service/v1/user;
            proxy_set_header Authorization $http_authorization;
        }

        # Загрузка файла - требует токен
        location = /v1/upload {
            auth_request /_validate_token;
            client_max_body_size 50M;
            proxy_pass http://uploader_service/v1/upload;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type $content_type;

            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Получение изображения по имени - требует токен
        location ~ ^/v1/user/(?<image_name>.+\.jpg)$ {
            auth_request /_validate_token;
            proxy_set_header Authorization $http_authorization;

            # Изменяем путь с /images/ на /data/ (название вашего бакета)
            rewrite ^/v1/user/(.*)$ /data/$1 break;
            proxy_pass http://minio_service;

            proxy_set_header Host storage:9000;
            proxy_buffering off;

            # Добавляем заголовки для MinIO
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ============ ОБРАБОТКА ОШИБОК ============

        error_page 401 = @error_401;
        location @error_401 {
            add_header Content-Type application/json;
            return 401 '{
                "error": "Unauthorized",
                "message": "Требуется валидный токен"
            }';
        }

        error_page 404 = @error_404;
        location @error_404 {
            add_header Content-Type application/json;
            return 404 '{
                "error": "Not Found",
                "message": "Ресурс не найден"
            }';
        }

        error_page 405 = @error_405;
        location @error_405 {
            add_header Content-Type application/json;
            return 405 '{
                "error": "Method Not Allowed",
                "message": "Метод не поддерживается"
            }';
        }
    }
}