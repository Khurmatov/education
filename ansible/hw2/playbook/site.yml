---
- name: Install Clickhouse
  hosts: clickhouse
  handlers:
    - name: Start clickhouse service
      become: true
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted
  tasks:
    - block:
        - name: Get clickhouse distrib
          ansible.builtin.get_url:
            url: "https://packages.clickhouse.com/rpm/stable/{{ item }}-{{ clickhouse_version }}.noarch.rpm"
            dest: "./{{ item }}-{{ clickhouse_version }}.rpm"
          with_items: "{{ clickhouse_packages }}"
      rescue:
        - name: Get clickhouse distrib
          ansible.builtin.get_url:
            url: "https://packages.clickhouse.com/rpm/stable/clickhouse-common-static-{{ clickhouse_version }}.x86_64.rpm"
            dest: "./clickhouse-common-static-{{ clickhouse_version }}.rpm"
    - name: Install clickhouse packages
      become: true
      ansible.builtin.yum:
        name:
          - clickhouse-common-static-{{ clickhouse_version }}.rpm
          - clickhouse-client-{{ clickhouse_version }}.rpm
          - clickhouse-server-{{ clickhouse_version }}.rpm
      notify: Start clickhouse service
    - name: Flush handlers
      meta: flush_handlers
    - name: Create database
      ansible.builtin.command: "clickhouse-client -q 'create database logs;'"
      register: create_db
      failed_when: create_db.rc != 0 and create_db.rc !=82
      changed_when: create_db.rc == 0
- name: Install Vector
  hosts: vector
  become: true
  vars:
    vector_bin_path: "/usr/local/bin/vector"
  tasks:
    # Создаем директории
    - name: Create Vector directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ vector_install_dir }}"
        - /etc/vector
        - /var/lib/vector
        - /var/log/vector
      tags: install

    # Скачиваем дистрибутив
    - name: Download Vector archive
      ansible.builtin.get_url:
        url: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-x86_64-unknown-linux-gnu.tar.gz"
        dest: "/tmp/vector-{{ vector_version }}.tar.gz"
        timeout: 30
      tags: install

    # Распаковываем архив
    - name: Extract Vector archive
      ansible.builtin.unarchive:
        src: "/tmp/vector-{{ vector_version }}.tar.gz"
        dest: "{{ vector_install_dir }}"
        remote_src: true
        creates: "{{ vector_install_dir }}/vector-{{ vector_version }}/bin/vector"
      tags: install

    # Устанавливаем бинарник
    - name: Install Vector binary
      ansible.builtin.file:
        src: "{{ vector_install_dir }}/vector-{{ vector_version }}/bin/vector"
        dest: "{{ vector_bin_path }}"
        state: link
        force: true
        mode: '0755'
      tags: install

    # Деплоим конфиг через шаблон
    - name: Deploy Vector configuration
      ansible.builtin.template:
        src: vector.yml.j2
        dest: /etc/vector/vector.yml
        mode: '0644'
      notify: restart vector
      tags: config

    # Деплоим systemd сервис
    - name: Deploy Vector systemd service
      ansible.builtin.template:
        src: vector.service.j2
        dest: /etc/systemd/system/vector.service
        mode: '0644'
      notify:
        - daemon-reload
        - restart vector
      tags: config

    # Запускаем сервис
    - name: Start Vector service
      ansible.builtin.systemd:
        name: vector
        state: started
        enabled: true
        daemon_reload: true
      tags: service

  handlers:
    - name: daemon-reload
      ansible.builtin.systemd:
        daemon_reload: true

    - name: restart vector
      ansible.builtin.systemd:
        name: vector
        state: restarted
