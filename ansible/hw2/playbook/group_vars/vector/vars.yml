---
# Версия Vector
vector_version: "0.38.1"

# Директория для установки
vector_install_dir: "/opt/vector"

# Путь к бинарнику
vector_bin_path: "/usr/local/bin/vector"

# Пользователь и группа для Vector
vector_user: "vector"
vector_group: "vector"

# Директории Vector
vector_dirs:
  - "{{ vector_install_dir }}"
  - /etc/vector
  - /var/lib/vector
  - /var/log/vector

# URL для скачивания
vector_download_url: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-x86_64-unknown-linux-gnu.tar.gz"

# Конфигурация ClickHouse для Vector
clickhouse_host: "localhost"
clickhouse_port: 8123
clickhouse_database: "logs"
clickhouse_table: "nginx_logs"