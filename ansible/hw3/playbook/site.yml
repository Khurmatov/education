---
- name: Install Clickhouse
  hosts: clickhouse
  gather_facts: false
  handlers:
    - name: Start clickhouse service
      become: true
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted
  tasks:
    - name: Clickhouse distrib
      block:
        - name: Clickhouse | Get clickhouse distrib
          ansible.builtin.get_url:
            url: "https://packages.clickhouse.com/rpm/stable/{{ item }}-{{ clickhouse_version }}.x86_64.rpm"
            dest: "/tmp/{{ item }}-{{ clickhouse_version }}.x86_64.rpm"
            mode: "0644"
          with_items: "{{ clickhouse_packages }}"
      rescue:
        - name: Clickhouse | Get clickhouse distrib
          ansible.builtin.get_url:
            url: "https://packages.clickhouse.com/rpm/stable/clickhouse-common-static-{{ clickhouse_version }}.x86_64.rpm"
            dest: "/tmp/clickhouse-common-static-{{ clickhouse_version }}.rpm"
            mode: "0644"
    - name: Install clickhouse packages
      become: true
      ansible.builtin.yum:
        name:
          - "/tmp/clickhouse-common-static-{{ clickhouse_version }}.x86_64.rpm"
          - "/tmp/clickhouse-client-{{ clickhouse_version }}.x86_64.rpm"
          - "/tmp/clickhouse-server-{{ clickhouse_version }}.x86_64.rpm"
      notify: Start clickhouse service
    - name: Flush handlers
      ansible.builtin.meta: flush_handlers
    - name: Create database
      ansible.builtin.command: "clickhouse-client -q 'create database logs;'"
      register: create_db
      failed_when: create_db.rc != 0 and create_db.rc != 82
      changed_when: create_db.rc == 0

- name: Install Vector
  hosts: vector
  vars_files:
    - vector/vars.yml
  handlers:
    - name: Daemon-reload
      become: true
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart vector
      become: true
      ansible.builtin.systemd:
        name: vector
        state: restarted

  tasks:
    # Создание директорий
    - name: Create Vector directories
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ vector_install_dir }}"
        - "{{ vector_config_dir }}"
      tags: vector

    # Скачивание архива
    - name: Download Vector archive
      become: true
      ansible.builtin.get_url:
        url: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-x86_64-unknown-linux-gnu.tar.gz"
        dest: "/tmp/vector-{{ vector_version }}.tar.gz"
        timeout: 30
        mode: '0644'
      tags: vector

    # Распаковка
    - name: Extract Vector to installation directory
      become: true
      ansible.builtin.unarchive:
        src: "/tmp/vector-{{ vector_version }}.tar.gz"
        dest: "{{ vector_install_dir }}"
        remote_src: true
        creates: "{{ vector_install_dir }}/vector-{{ vector_version }}/bin/vector"
      tags: vector

    # Установка бинарника
    - name: Install Vector binary
      become: true
      ansible.builtin.file:
        src: "{{ vector_install_dir }}/vector-{{ vector_version }}/bin/vector"
        dest: "{{ vector_bin_path }}"
        state: link
        force: true
        mode: '0755'
      tags: vector

    # Создание systemd сервиса
    - name: Create Vector systemd service
      become: true
      ansible.builtin.template:
        src: vector.service.j2
        dest: /etc/systemd/system/vector.service
        mode: '0644'
      notify:
        - Daemon-reload
        - Restart vector
      tags: vector

    # Деплой конфигурации
    - name: Deploy Vector configuration
      become: true
      ansible.builtin.template:
        src: vector.yml.j2
        dest: "{{ vector_config_dir }}/vector.yml"
        mode: '0644'
      notify: Restart vector
      tags: vector

    # Включение и запуск сервиса
    - name: Enable and start Vector service
      become: true
      ansible.builtin.systemd:
        name: vector
        state: started
        enabled: true
        daemon_reload: true
      tags: vector

- name: Install LightHouse
  hosts: lighthouse
  handlers:
    - name: Restart nginx
      become: true
      ansible.builtin.service:
        name: nginx
        state: restarted

  tasks:
    - name: Install EPEL repository (CentOS/RHEL)
      become: true
      ansible.builtin.yum:
        name: epel-release
        state: present
      when: ansible_os_family == "RedHat"

    # Установка Nginx
    - name: Install Nginx
      become: true
      ansible.builtin.yum:
        name: nginx
        state: present
      when: ansible_os_family == "RedHat"

    # Создание директории для LightHouse
    - name: Create LightHouse directory
      become: true
      ansible.builtin.file:
        path: "{{ lighthouse_install_dir }}"
        state: directory
        mode: '0755'
        owner: "{{ nginx_user }}"
        group: "{{ nginx_user }}"

    # Скачивание статики LightHouse
    - name: Download LightHouse static files
      become: true
      ansible.builtin.get_url:
        url: "{{ lighthouse_download_url }}"
        dest: "/tmp/lighthouse-{{ lighthouse_version }}.tar.gz"
        timeout: 60
        mode: '0644'

    # Распаковка LightHouse
    - name: Extract LightHouse
      become: true
      ansible.builtin.unarchive:
        src: "/tmp/lighthouse-{{ lighthouse_version }}.tar.gz"
        dest: "/tmp"
        remote_src: true
        creates: "/tmp/lighthouse-{{ lighthouse_version }}"

    # Копирование статики в веб-директорию
    - name: Copy LightHouse demo to web directory
      become: true
      ansible.builtin.copy:
        src: "/tmp/lighthouse-{{ lighthouse_version }}/docs/demo/"
        dest: "{{ lighthouse_install_dir }}"
        remote_src: true
        owner: "{{ nginx_user }}"
        group: "{{ nginx_user }}"
        mode: '0755'

    # Настройка конфига Nginx
    - name: Deploy Nginx configuration for LightHouse
      become: true
      ansible.builtin.template:
        src: lighthouse-nginx.conf.j2
        dest: "{{ nginx_conf_dir }}/lighthouse.conf"
        mode: '0644'
      notify: Restart nginx

    # Запуск Nginx
    - name: Start and enable Nginx
      become: true
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
